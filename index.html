    <script>
      // Applies the theme before first paint so nobody sees a flash: the
      // stored choice if there is one, otherwise the OS preference.
      // Mirrors resolveInitialTheme() in src/theme/ThemeProvider.tsx.
      (function () {
        var theme;
        try {
          var stored = localStorage.getItem('promptly-theme');
          if (stored === 'dark' || stored === 'light') theme = stored;
        } catch (e) {
          /* storage blocked — fall back to the OS preference */
        }
        if (!theme)
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (theme === 'dark') document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
